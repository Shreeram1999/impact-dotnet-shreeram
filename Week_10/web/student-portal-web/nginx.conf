server {
    listen 80;
    root /usr/share/nginx/html;

    # Client-side routing: /students, /reports, /login are React routes, so
    # any path that isn't a real file serves index.html.
    location / {
        try_files $uri /index.html;
    }

    # Hashed build assets can be cached forever; index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
